# Tests every push and pull request that touches the forum app. On main, once
# deploying is switched on (repository variable DEPLOY_ENABLED = true), applies
# new D1 migrations and deploys the Worker to Cloudflare.
name: Forum

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/forum.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/forum.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Add required reviewers to the "production" environment in GitHub to approve each deploy by hand.
    environment:
      name: production
      url: https://forum.nodebox.net
    # One deploy at a time; a newer push waits rather than racing a migration.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check the D1 database id is set
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo "::error::Put the real database_id in web/wrangler.jsonc (wrangler d1 create nodebox-forum)."
            exit 1
          fi
      - run: npm run build:client
      # Migrations run before the new code goes live, so they must keep the old code working (add, don't drop).
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nodebox-forum --remote
      - name: Deploy
        run: npx wrangler deploy
